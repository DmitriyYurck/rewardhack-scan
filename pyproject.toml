[project]
name = "rewardhack-scan"
version = "0.1.0"
description = "Detect reward hacking in coding-agent trajectories"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.0", "ruff>=0.4", "mypy>=1.10", "types-PyYAML>=6.0"]

[project.scripts]
rhscan = "rhscan.cli:main"
rhscan-bench = "benchgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rhscan", "benchgen"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"benchgen/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
packages = ["rhscan"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["docker: requires a working Docker daemon (slow, network for builds)"]
